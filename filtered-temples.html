<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Kyla Gwen Papa">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="WDD 131 – Dynamic Web Fundamentals temple album by Kyla Gwen Papa with ten temples, lazy-loaded photos, and filters by dedication year and size.">

    <title>Filtered Temple Album | Kyla Gwen Papa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&amp;family=Roboto:wght@400;500&amp;display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/filtered-temples.css">
    <link rel="stylesheet" href="styles/filtered-temples-large.css">

    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>
    <header>
        <h1 id="course-title">Temple Album</h1>

        <button id="menu" type="button" aria-label="Open navigation menu" aria-controls="temple-navigation"
            aria-expanded="false"></button>

        <nav aria-label="Temple filters">
            <ul id="temple-navigation" class="navigation">
                <li><a id="home" href="#temple-gallery" data-filter="home" class="active" aria-current="page">Home</a>
                </li>
                <li><a id="old" href="#temple-gallery" data-filter="old">Old</a></li>
                <li><a id="new" href="#temple-gallery" data-filter="new">New</a></li>
                <li><a id="large" href="#temple-gallery" data-filter="large">Large</a></li>
                <li><a id="small" href="#temple-gallery" data-filter="small">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 id="filter-title">Home</h2>
        <p id="temple-count" role="status" aria-live="polite" aria-atomic="true"></p>

        <div id="temple-gallery" class="temple-gallery"></div>
        <noscript>
            <p>Please enable JavaScript to view and filter this temple album.</p>
        </noscript>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Kyla Gwen Papa | Philippines
        </p>

        <p>
            Last Modified: <span id="lastModified"></span>
        </p>
    </footer>
</body>

</html>
