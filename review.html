<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View your submitted product review and the number of reviews completed in this browser.">
  <meta name="author" content="Kyla Gwen Papa">
  <title>Review Confirmation | Kyla Gwen Papa</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/products.js" defer></script>
  <script src="scripts/review.js" defer></script>
  <script src="scripts/footer.js" defer></script>
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">YOUR EXPERIENCE MATTERS</p>
    <h1>Product Review</h1>
    <p>Every review helps.</p>
  </header>

  <main>
    <section class="confirmation-card" aria-labelledby="confirmation-title">
      <div class="confirmation-icon" aria-hidden="true">✓</div>
      <h2 id="confirmation-title">Checking your review…</h2>
      <p id="confirmation-message">Please wait while we check your submission.</p>

      <div id="review-details" hidden>
        <dl class="review-summary">
          <div><dt>Product</dt><dd id="submitted-product"></dd></div>
          <div><dt>Rating</dt><dd id="submitted-rating"></dd></div>
          <div><dt>Installed</dt><dd id="submitted-date"></dd></div>
          <div><dt>Useful features</dt><dd id="submitted-features"></dd></div>
          <div id="written-summary" hidden><dt>Your review</dt><dd id="submitted-review"></dd></div>
          <div id="name-summary" hidden><dt>Reviewer</dt><dd id="submitted-name"></dd></div>
        </dl>

        <div class="review-count">
          <span id="review-count">0</span>
          <p>Reviews completed in this browser</p>
        </div>
        <p class="field-hint" id="storage-message" hidden></p>
      </div>

      <a class="button-link" href="form.html">Write a Review</a>
      <noscript><p>Please enable JavaScript to view your review and update the counter.</p></noscript>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="currentyear"></span> | Kyla Gwen Papa | Philippines</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
